services:
  - type: web
    name: cfloral
    runtime: node
    plan: free
    buildCommand: >
      cd server && npm install && npx prisma generate && npx prisma migrate deploy && npm run build &&
      cd ../client && npm install && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
